# -----------------------------------------------------
# General window decoration
# name: "Rounding All Blur No Shadows"
# -----------------------------------------------------

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9

    blur {
        enabled = true
        size = 12
        passes = 4
        ignore_opacity = true
        xray = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 2
        # color = 0x33000000
	color = rgba(00000033)
    }
}

layerrule = match:namespace ^waybar$, blur on
layerrule = match:namespace ^waybar$, ignore_alpha 0.1
