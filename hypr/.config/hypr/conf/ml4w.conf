# Pavucontrol floating
windowrule {
    name = .*org.pulseaudio.pavucontrol.*
    float = on
    size = 700 600
    center = on
    pin = on
}

# Waypaper
windowrule {
    name = .*waypaper.*
    float = on
    size = 900 700
    center = on
    pin = on
}

# SwayNC
layerrule {
    name = swaync-control-center
    blur = on
    ignore_alpha = 0.5
}

layerrule {
    name = swaync-notification-window
    blur = on
    ignore_alpha = 0.5
}

# Newelle
windowrule {
    name = io.github.qwersyk.Newelle
    float = on
    size = 1000 700
    center = on
    pin = on
}

# ML4W Calendar floating
windowrule {
    name = com.ml4w.calendar
    float = on
    move = 100%-w-16 66
    pin = on
    size = 400 400
}

# ML4W Sidebar floating
windowrule {
    name = com.ml4w.sidebar
    float = on
    move = 100%-w-16 66
    pin = on
    size = 400 660
}

# ML4W Welcome App floating
windowrule {
    name = com.ml4w.welcome
    float = on
    size = 700 600
    center = on
    pin = on
}

# ML4W Settings App floating
windowrule {
    name = com.ml4w.settings
    float = on
    size = 800 600
    move = 10% 20%
}

# Blueman Manager
windowrule = match:class ^blueman-manager$, float on
windowrule = match:class ^blueman-manager$, size 800 600
windowrule = match:class ^blueman-manager$, center on

# nwg-look
windowrule {
    name = nwg-look
    float = on
    size = 700 600
    move = 10% 20%
    pin = on
}

# nwg-displays
windowrule {
    name = nwg-displays
    float = on
    size = 900 600
    move = 10% 20%
    pin = on
}

# System Mission Center
windowrule {
    name = io.missioncenter.MissionCenter
    float = on
    pin = on
    center = on
    size = 900 600
}

# System Mission Center Preference Window
windowrule {
    name = missioncenter
    match:title = ^Preferences$
    float = on
    pin = on
    center = on
}

# Hyprland Share Picker
windowrule {
    name = hyprland-share-picker
    float = on
    pin = on
    center = on
    size = 600 400
}

# General floating
windowrule {
    name = dotfiles-floating
    float = on
    size = 1000 700
    center = on
}

# Dotfiles Sidepad
windowrule {
    name = dotfiles-sidepad
    float = on
    size = 1000 700
    center = on
    pin = on
}
# Float and center file pickers
windowrule = match:class ^xdg-desktop-portal-gtk$ match:title ^(Open.*Files?|Save.*Files?|All Files|Save)$, float on
windowrule = match:class ^xdg-desktop-portal-gtk$ match:title ^(Open.*Files?|Save.*Files?|All Files|Save)$, center on

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# XWayland
xwayland {
  force_zero_scaling = true
}
