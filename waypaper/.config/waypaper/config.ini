# Managed by set-wallpaper.sh — wallpaper = line is rewritten on switch (SSOT: hypr/conf/config.sh wallpaper_file)
[Settings]
language = en
folder = ~/wallpaper
wallpaper = ~/wallpaper/SwissWallpaper.JPG
backend = hyprpaper
monitors = All
fill = fill
sort = name
color = #ffffff
subfolders = False
show_hidden = False
show_gifs_only = False
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
use_xdg_state = False
show_path_in_tooltip = True
all_subfolders = False
zen_mode = False
